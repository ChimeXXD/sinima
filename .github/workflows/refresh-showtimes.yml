# ---------------------------------------------------------------------------------------------
# Live showtimes (D-116): reads every cleared source that has a reader (`refresh --live`, today
# Lagocine for the cinemas data/sources.json gives it), writes data/live/, and commits it; Vercel
# deploys the commit, and the build's `refresh --build` puts that data where the pages read it.
#
# A source that can't be read fails the run, so nothing is committed and the site keeps the last
# good data; its pages then say how old the times are (DATA §Freshness).
#
# Times are UTC: 05:17, 11:17, 15:17 UTC = 06:17, 12:17, 16:17 in Lagos. Odd minutes avoid the
# top-of-hour queue. Three runs a day is the most data/sources.json allows a source (rateLimit).
# In a public repo, GitHub disables schedules after 60 days without activity; the commits count.
# ---------------------------------------------------------------------------------------------
name: Refresh showtimes

on:
  schedule:
    - cron: "17 5,11,15 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-showtimes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the cleared sources, validate, write data/live/
        run: npm run refresh -- --live
        env:
          FETCH_USER_AGENT: "SinimaBot/0.1 (+https://github.com/ChimeXXD/sinima)"

      - name: Commit if changed
        run: |
          # Stage first: `git diff` alone does not see files that are new in this run.
          git add -A -- data/live
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          # Commit as the repo owner: Vercel Hobby may not deploy other authors' commits (D-27).
          git config user.name "Chimexd"
          git config user.email "55363319+ChimeXXD@users.noreply.github.com"
          git commit -m "chore(data): refresh showtimes"
          # A push to main since checkout would refuse ours; this commit only touches data/live.
          git pull --rebase origin main
          git push
