# ---------------------------------------------------------------------------------------------
# Live showtimes (D-116): reads every cleared source that has a reader (`refresh --live`: each
# cinema's own site where we can read it, D-122, and Lagocine for the cinemas data/sources.json
# still gives it, D-76), writes data/live/, and commits it; Vercel
# deploys the commit, and the build's `refresh --build` puts that data where the pages read it.
#
# A source that can't be read keeps its last good showings, marked failing and dated when they
# were read, so its pages say how old the times are (DATA §Freshness, D-119). Only when every source
# fails does the run fail, and then nothing is committed.
#
# Three runs a day (06:17, 12:17, 16:17 Lagos) is the most data/sources.json allows a source
# (rateLimit). The timer lives at cron-job.org and calls GitHub's workflow_dispatch with a
# fine-grained token limited to this repository's Actions (D-128).
# ---------------------------------------------------------------------------------------------
name: Refresh showtimes

# Started by cron-job.org at 06:17, 12:17 and 16:17 Lagos (D-128): GitHub's own schedule never ran
# this job on 17 Nov. It can still be started by hand from the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: refresh-showtimes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: with the secret, new films get their TMDB poster, runtime and trailer (D-117).
      # Only the TMDB step sees the token itself.
      HAS_TMDB_TOKEN: ${{ secrets.TMDB_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Readers of listings built by script open them in a headless Chromium (D-119). The browser
      # starts only when such a reader runs, and closes at the end of the read.
      - name: Install the headless browser
        run: npx playwright install --with-deps chromium

      - name: Read the cleared sources, validate, write data/live/
        run: npm run refresh -- --live
        env:
          FETCH_USER_AGENT: "SinimaBot/0.1 (+https://github.com/ChimeXXD/sinima)"

      # After the read, so the films just read are the ones looked up. A film is asked about at most
      # once a week; the build puts data/credits.json on the live films.
      - name: Match new films to TMDB (posters, runtimes, trailers)
        if: env.HAS_TMDB_TOKEN == 'true'
        # TMDB being down must not cost the showtimes just read: on a failure nothing is written
        # and the commit below still runs.
        continue-on-error: true
        run: node scripts/tmdb.ts
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

      - name: Commit if changed
        run: |
          # Stage first: `git diff` alone does not see files that are new in this run.
          git add -A -- data/live data/credits.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          # Commit as the repo owner: Vercel Hobby may not deploy other authors' commits (D-27).
          git config user.name "Chimexd"
          git config user.email "55363319+ChimeXXD@users.noreply.github.com"
          git commit -m "chore(data): refresh showtimes"
          # A push to main since checkout would refuse ours; this commit only touches data/live.
          git pull --rebase origin main
          git push
